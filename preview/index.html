<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel STO Lab Preview</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f1e8; color: #11243d; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 48px 24px; }
    .hero { background: linear-gradient(135deg, #11243d, #183654); color: #fff; border-radius: 28px; padding: 36px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; }
    .card { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 12px 30px rgba(17,36,61,.12); }
    .num { font-size: 28px; font-weight: 900; }
    .layout { display: grid; grid-template-columns: 1.2fr .8fr; gap: 20px; margin-top: 24px; }
    .bar { height: 120px; display:flex; align-items:end; gap:10px; }
    .bar span { display:block; width: 38px; background:#c7a45b; border-radius:8px 8px 0 0; }
    @media (max-width: 800px) { .grid, .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Hotel STO Lab</h1>
      <p>호텔 객실 수익 기반 STO 배당 시뮬레이션 - 교육용 모의투자 대시보드</p>
    </section>
    <section class="grid">
      <div class="card"><p>객실매출</p><div class="num">1.79억</div></div>
      <div class="card"><p>배당가능이익</p><div class="num">7,600만</div></div>
      <div class="card"><p>내 배당금</p><div class="num">76,002원</div></div>
      <div class="card"><p>월 ROI</p><div class="num">7.60%</div></div>
    </section>
    <section class="layout">
      <div class="card">
        <h2>월별 배당 시뮬레이션</h2>
        <div class="bar"><span style="height:55%"></span><span style="height:42%"></span><span style="height:75%"></span><span style="height:90%"></span><span style="height:66%"></span></div>
      </div>
      <div class="card">
        <h2>리스크 이벤트</h2>
        <p>기상 악화: 점유율 -25%</p>
        <p>OTA 수수료 인상: 운영비율 +5%</p>
        <p>지역 축제: ADR +10%</p>
      </div>
    </section>
    <p style="margin-top:24px; color:#7f3b3b;">본 화면은 교육용 시뮬레이션입니다. 실제 투자, 청약, 배당 지급 기능을 제공하지 않습니다.</p>
  </main>
</body>
</html>
